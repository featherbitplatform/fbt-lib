name: Fuzz

# Fuzzes every parser of remote input. Short run on pull requests that touch a
# parser; long run weekly (Mondays 05:30, as in security.yml); manual runs take
# a duration. The corpus is cached between runs.

on:
  pull_request:
    paths:
      - "crates/fbt-bencode/**"
      - "crates/fbt-metainfo/**"
      - "crates/fbt-wire/**"
      - "crates/fbt-tracker/**"
      - "crates/fbt-dht/**"
      - "crates/fbt-utp/**"
      - "crates/fbt-net/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to fuzz each target"
        default: "600"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - bencode
          - metainfo
          - wire_codec
          - handshake
          - http_announce
          - udp_announce
          - path
          - krpc
          - extension
          - mse
          - magnet
          - utp_packet
          - utp_conn
          - lsd
          - ssdp
          - upnp_xml
          - natpmp
          - socks5
          - http_connect
          - scrape
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz || cargo install cargo-fuzz --locked
      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          DISPATCH_SECONDS: ${{ inputs.seconds }}
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in
            workflow_dispatch) FUZZ_SECONDS=$DISPATCH_SECONDS ;;
            schedule) FUZZ_SECONDS=1200 ;;
            *) FUZZ_SECONDS=60 ;;
          esac
          case $FUZZ_SECONDS in ''|*[!0-9]*) echo "bad duration: $FUZZ_SECONDS"; exit 1;; esac
          mkdir -p "fuzz/corpus/$TARGET"
          cargo +nightly fuzz run "$TARGET" \
            "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" \
            -- -max_total_time="$FUZZ_SECONDS"
      - name: Minimize corpus
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo +nightly fuzz cmin "$TARGET" "fuzz/corpus/$TARGET"
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
