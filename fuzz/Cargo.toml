[package]
name = "fbt-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1.12"
tokio-util = { version = "0.7", features = ["codec"] }
fbt-bencode = { path = "../crates/fbt-bencode" }
fbt-metainfo = { path = "../crates/fbt-metainfo" }
fbt-wire = { path = "../crates/fbt-wire" }
fbt-tracker = { path = "../crates/fbt-tracker" }
fbt-dht = { path = "../crates/fbt-dht" }
fbt-core = { path = "../crates/fbt-core" }
fbt-utp = { path = "../crates/fbt-utp" }
fbt-net = { path = "../crates/fbt-net" }
tokio = { version = "1", default-features = false, features = ["rt", "io-util"] }

[workspace]
members = ["."]

[profile.release]
debug = 1


[[bin]]
name = "bencode"
path = "fuzz_targets/bencode.rs"
test = false
doc = false
bench = false

