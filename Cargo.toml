[workspace]
members = ["crates/*"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/featherbitplatform/fbt-lib"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"

# Every dependency is declared here and inherited with `dep.workspace = true`;
# crates never pin their own versions.
[workspace.dependencies]
thiserror = "2"
# NFC normalisation for collision keys (macOS and others normalise file names).
unicode-normalization = "0.1"
bytes = "1.12"
tokio = { version = "1", default-features = false }
# IPv6-only sockets (IPV6_V6ONLY), so IPv4 and IPv6 share a port: the DHT's
# and fbt-net's UDP sockets and the session's TCP listeners.
socket2 = "0.6"
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
proptest = "1.12"
sha1 = "0.11"
# MSE/PE: rc4 0.2 uses cipher 0.5, the same RustCrypto generation as sha1 0.11.
rc4 = "0.2"
crypto-bigint = { version = "0.7", default-features = false }
tempfile = "3"
sha2 = "0.11"
# BEP 44 mutable items: ed25519 signatures. 3.0.0 has no `std` feature;
# `fast` (precomputed tables) and `zeroize` (secret keys wiped on drop) only.
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
rand = "0.10"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
# The connector trait hyper's client takes (the trackers' proxy connector).
tower-service = "0.3"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.1.0-pre.0"
webpki-roots = "1"
bitflags = "2"
futures-core = { version = "0.3", default-features = false }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
clap = { version = "4.6", features = ["derive"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }
# fbt-api only (core crates stay server-free; dev/check-pure-rust.sh checks it).
# `matched-path` is what the auth layer's query-token rule reads.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query", "matched-path"] }
utoipa = { version = "6", features = ["preserve_order"] }
utoipa-axum = "0.3"
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
