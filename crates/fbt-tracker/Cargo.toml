[package]
name = "fbt-tracker"
description = "Tracker clients (HTTP and UDP)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde"]
tls-ring = [
    "dep:rustls",
    "rustls/ring",
    "dep:hyper-rustls",
    "hyper-rustls/ring",
    "dep:webpki-roots",
]
tls-rustcrypto = [
    "dep:rustls",
    "dep:hyper-rustls",
    "dep:webpki-roots",
    "dep:rustls-rustcrypto",
]

[dependencies]
fbt-bencode = { path = "../fbt-bencode" }
fbt-core = { path = "../fbt-core" }
thiserror.workspace = true
serde = { workspace = true, optional = true }
bytes.workspace = true
tokio = { workspace = true, features = ["time", "net", "sync", "rt"] }
rand.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
hyper-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-rustcrypto = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "time"] }
