[package]
name = "fbt-example"
description = "Example downloader built on fbt."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fbt = { path = "../fbt" }
fbt-api = { path = "../fbt-api" }
fbt-net = { path = "../fbt-net" }
fbt-bencode = { path = "../fbt-bencode" }
sha1.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "io-util", "sync"] }
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The loopback web seed of `fbt-session`'s tests (`tests/support/web_seed.rs`).
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "time"] }
