[package]
name = "fbt-session"
description = "Torrent session engine: peers, pieces, storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
tls-ring = ["fbt-tracker/tls-ring"]
tls-rustcrypto = ["fbt-tracker/tls-rustcrypto"]

[dependencies]
fbt-tracker = { path = "../fbt-tracker" }
fbt-core = { path = "../fbt-core" }
fbt-metainfo = { path = "../fbt-metainfo" }
fbt-wire = { path = "../fbt-wire" }
bytes.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-util.workspace = true
futures-util.workspace = true
sha1.workspace = true
rand.workspace = true
bitflags.workspace = true
futures-core.workspace = true
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
fbt-bencode = { path = "../fbt-bencode" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "test-util"] }
