[package]
name = "fbt-session"
description = "Torrent session engine: peers, pieces, storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde", "fbt-tracker/serde", "fbt-net/serde"]
tls-ring = ["fbt-tracker/tls-ring"]
tls-rustcrypto = ["fbt-tracker/tls-rustcrypto"]

[dependencies]
fbt-tracker = { path = "../fbt-tracker" }
fbt-core = { path = "../fbt-core" }
fbt-metainfo = { path = "../fbt-metainfo" }
fbt-wire = { path = "../fbt-wire" }
fbt-dht = { path = "../fbt-dht" }
fbt-net = { path = "../fbt-net" }
fbt-utp = { path = "../fbt-utp" }
fbt-bencode = { path = "../fbt-bencode" }
socket2.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-util.workspace = true
futures-util.workspace = true
sha1.workspace = true
rand.workspace = true
bitflags.workspace = true
futures-core.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "test-util"] }
