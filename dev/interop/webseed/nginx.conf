# nginx as a BEP 19 web seed for the interop `webseed` scenario: serves
# target/interop/payload6 (mounted read-only at /srv/payload) on port 80,
# byte ranges included (206), and logs every request with its status and
# Range header to stdout, where run.sh looks for 206.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    log_format webseed '$remote_addr "$request" $status $body_bytes_sent range="$http_range"';
    access_log /dev/stdout webseed;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 80;
        root /srv/payload;
        location / {
            autoindex off;
        }
    }
}
