# Dante (danted 1.4) for the interop `proxy` scenario. The container has one
# interface (eth0, on `swarm`), used both to accept clients and to reach the
# other services; nothing beyond `swarm` is reachable (it is internal).
logoutput: stderr
internal: 0.0.0.0 port = 1080
external: eth0
# No authentication, from clients or towards targets.
clientmethod: none
socksmethod: none
user.privileged: root
user.unprivileged: nobody

client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: error connect disconnect
}
# TCP CONNECT (peers, HTTP trackers) and UDP ASSOCIATE (DHT, uTP, UDP
# trackers); `udpreply` lets the targets' answers back through the relay.
socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: connect udpassociate
    log: error connect disconnect
}
socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: udpreply
    log: error connect disconnect
}
